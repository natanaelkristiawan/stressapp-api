---
kind: Service
apiVersion: v1
metadata:
  name: $PROJECT_NAME
spec:
  type: ClusterIP
  selector:
    app: $PROJECT_NAME
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: api-port
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: $PROJECT_NAME
  labels:
    app: $PROJECT_NAME
spec:
  replicas: 1
  selector:
    matchLabels:
      app: $PROJECT_NAME
  template:
    metadata:
      labels:
        app: $PROJECT_NAME
    spec:
      containers:
      - name: $PROJECT_NAME
        image: $ARN_NUMBER.dkr.ecr.$REGION.amazonaws.com/$PROJECT_NAME:$ENV-$PACKAGE_VERSION
        ports:
          - name: api-port
            containerPort: 5500
            protocol: TCP
        volumeMounts:
            - name: env
              mountPath: /dist/.env
              subPath: .env
        resources:
            requests:
              memory: "100M"
              cpu: "50m"
            limits:
              memory: "1792M"
              cpu: "500m"
      volumes:
        - name: env
          secret:
            secretName: $PROJECT_NAME-env
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: $PROJECT_NAME
spec:
  maxReplicas: 3
  minReplicas: 1
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: $PROJECT_NAME
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 80
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: $PROJECT_NAME
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
spec:
  tls:
  - hosts:
    - "mimate-api.mymitsubishiapps.com"
    secretName: micrositesectigojun2026
  rules:
  - host: 'mimate-api.mymitsubishiapps.com'
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: $PROJECT_NAME
            port:
              number: 80


