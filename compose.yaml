name: stressapp-api

services:
  api:
    build: .
    ports:
      - "127.0.0.1:${API_PORT:-3100}:3000"
    environment:
      NODE_ENV: development
      PORT: "3000"
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USERNAME: ${MYSQL_USER:-stressapp}
      DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env.docker}
      # Compatibility names until the legacy identity modules are replaced.
      # Both use ONE fresh database. Schema synchronization remains disabled.
      DB_DATABASE_MIMATE: ${MYSQL_DATABASE:-stressapp}
      DB_DATABASE_MMID: ${MYSQL_DATABASE:-stressapp}
      BULL_HOST: redis
      BULL_PORT: "6379"
      BULL_TLS: "false"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.docker}
      EMAIL_HOST: ${EMAIL_HOST:-mailpit}
      EMAIL_PORT: ${EMAIL_PORT:-1025}
      EMAIL_USERNAME: ${EMAIL_USERNAME:-}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-Temu SoBAT <noreply@stressapp.test>}
      EMAIL_SECURE: ${EMAIL_SECURE:-false}
      EMAIL_FROM_ADDRESS: noreply@stressapp.test
      LEADERBOARD_ENABLED: "false"
      LEADERBOARD_READ_ENABLED: "false"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/is-live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-stressapp}
      MYSQL_USER: ${MYSQL_USER:-stressapp}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env.docker}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env.docker}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -u\"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      start_period: 40s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:${MAIL_UI_PORT:-8026}:8025"

volumes:
  mysql-data:
  redis-data:
